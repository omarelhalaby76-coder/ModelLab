[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "model-lab-tool"
version = "1.0.6"
description = "A modular machine learning toolkit supporting classification and regression."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    {name = "Omar Elhalaby"}
]
dependencies = [
    "pandas",
    "numpy",
    "scikit-learn"
]

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
model-lab-tool = "modellab.main:main"